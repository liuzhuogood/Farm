name: macOS DMG

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            target: darwin-aarch64
          - os: macos-15-intel
            arch: amd64
            target: darwin-x86_64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      DESKTOP_BUNDLES: app,dmg
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      FARM_UPDATER_PUBLIC_KEY: ${{ vars.FARM_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90.0'
      - name: Apply release version
        run: node scripts/sync-version.mjs --version "${RELEASE_TAG#v}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate tagged source
        run: |
          test "$(cat VERSION | tr -d '\r\n')" = "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test -n "$FARM_UPDATER_PUBLIC_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          node scripts/sync-version.mjs --check
          node --test scripts/sync-version.test.mjs
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir desktop install --frozen-lockfile
      - name: Build signed macOS GUI and updater package
        run: node scripts/build-desktop.mjs --signed
      - name: Verify updater signature
        run: node scripts/verification/update-signature.mjs
      - name: Verify macOS updater archive
        run: node scripts/verification/macos-updater.mjs
      - name: Verify mounted DMG and name GUI asset
        run: node scripts/verification/macos-dmg.mjs desktop/target/release/bundle ${{ matrix.arch }} "$RELEASE_TAG" dmg-artifacts
      - name: Generate platform update manifest
        run: node scripts/desktop-manifest.mjs desktop/target/release/bundle ${{ matrix.target }} desktop-manifest-${{ matrix.target }}.json "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.arch }}-dmg
          path: |
            dmg-artifacts/*.dmg
            desktop/target/release/bundle/**/*.app.tar.gz
            desktop/target/release/bundle/**/*.app.tar.gz.sig
            desktop-manifest-${{ matrix.target }}.json
          if-no-files-found: error
